<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SIMID Diagnostics</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
</style>
</head>
<body>

<script>
(function () {
  "use strict";

  var PIXEL_HTML = "https://httpbin.org/get?evt=fired_by_HTML";
  var PIXEL_PLAYER = "https://httpbin.org/get?evt=fired_by_player_catered_by_HTML";

  var HANDSHAKE_TIMEOUT_MS = 4000;

  function firePixelByHtml(step, extra) {
    var img = new Image();
    var qs = "&step=" + encodeURIComponent(step) + "&cb=" + Date.now();
    if (extra) qs += "&info=" + encodeURIComponent(extra);
    img.src = PIXEL_HTML + qs;
  }

  function firePixelByPlayer(step) {
    sendMessage("SIMID:Creative:reportTracking", {
      trackingUrls: [PIXEL_PLAYER + "&step=" + encodeURIComponent(step) + "&cb=" + Date.now()]
    }).catch(function () {});
  }

  var inIframe = window.parent !== window;
  var sessionId = null;
  var sessionEstablished = false;
  var messageIdCounter = 0;
  var pending = {};
  var handshakeTimer = null;
  var renderConfirmed = false;

  function uuidv4() {
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      var v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  function sendMessage(type, args) {
    if (!inIframe) {
      console.log("[SIMID diagnostics - standalone preview]", type, args || {});
      return Promise.resolve({});
    }
    var messageId = ++messageIdCounter;
    var payload = { sessionId: sessionId, messageId: messageId, timestamp: Date.now(), type: type, args: args || {} };
    window.parent.postMessage(JSON.stringify(payload), "*");
    return new Promise(function (resolve, reject) {
      pending[messageId] = { resolve: resolve, reject: reject };
    });
  }

  function respond(kind, messageId, value) {
    if (!inIframe) return;
    window.parent.postMessage(JSON.stringify({
      sessionId: sessionId,
      messageId: ++messageIdCounter,
      timestamp: Date.now(),
      type: kind,
      args: { messageId: messageId, value: value || {} }
    }), "*");
  }

  function onMessage(event) {
    var msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    if (!msg || typeof msg !== "object" || !msg.type) return;

    if (msg.type === "resolve" || msg.type === "reject") {
      var waiter = pending[msg.args && msg.args.messageId];
      if (waiter) {
        delete pending[msg.args.messageId];
        if (msg.type === "resolve") {
          firePixelByHtml("message_resolved_by_player");
          waiter.resolve(msg.args.value);
        } else {
          waiter.reject(msg.args.value);
        }
      }
      return;
    }

    switch (msg.type) {
      // FIX 2: some players initiate the session themselves instead of
      // waiting for the creative to do it. Handle an incoming createSession:
      // adopt the player's sessionId and resolve, so either handshake
      // direction works.
      case "createSession":
        sessionEstablished = true;
        sessionId = msg.sessionId || sessionId;
        firePixelByHtml("player_initiated_session_received");
        respond("resolve", msg.messageId, {});
        break;
      case "SIMID:Player:init":
        sessionEstablished = true;
        if (msg.sessionId) sessionId = msg.sessionId;
        firePixelByHtml("player_init_received");
        respond("resolve", msg.messageId, {});
        break;
      case "SIMID:Player:startCreative":
        renderConfirmed = true;
        clearTimeout(handshakeTimer);
        firePixelByHtml("start_creative_received");
        firePixelByPlayer("start_creative_received");
        respond("resolve", msg.messageId, {});
        break;
      case "SIMID:Player:adSkipped":
        firePixelByHtml("ad_skipped_received");
        respond("resolve", msg.messageId, {});
        break;
      case "SIMID:Player:adStopped":
        firePixelByHtml("ad_stopped_received");
        respond("resolve", msg.messageId, {});
        break;
      case "SIMID:Player:fatalError":
        firePixelByHtml("fatal_error_received", (msg.args && msg.args.reason) || "");
        respond("resolve", msg.messageId, {});
        break;
    }
  }

  function init() {
    firePixelByHtml("creative_script_loaded");

    window.addEventListener("message", onMessage);

    if (!inIframe) {
      firePixelByHtml("standalone_mode");
      return;
    }

    sessionId = uuidv4();
    firePixelByHtml("create_session_sent");
    sendMessage("createSession");

    handshakeTimer = setTimeout(function () {
      if (!renderConfirmed) {
        firePixelByHtml("handshake_timeout", sessionEstablished ? "session_ok_no_startCreative" : "no_session");
      }
    }, HANDSHAKE_TIMEOUT_MS);
  }

  // FIX 1: don't rely solely on DOMContentLoaded. If the player injected
  // this document into an iframe that has already finished parsing,
  // DOMContentLoaded has fired and the listener would never trigger.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
